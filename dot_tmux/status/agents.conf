# vim:set ft=tmux:
#
# Catppuccin status module: coding agent inventory (blocked/working/done).
# Sourced from ~/.tmux.conf after the theme has loaded; the count comes from
# ~/bin/tmux-agent-count, which prints nothing when no agents exist.
#
# This lives in its own file for a reason. `%hidden` is applied while a file is
# parsed, but `run` defers execution, so setting MODULE_NAME directly in
# tmux.conf would be undone by the theme's own load: catppuccin sources a dozen
# modules of its own, each reassigning MODULE_NAME, and the last one wins. The
# module would then be built under that name and quietly overwrite it. Keeping
# the definition here means nothing runs between the %hidden and the source.

%hidden MODULE_NAME="agents"

set -ogq "@catppuccin_${MODULE_NAME}_icon" "󰚩 "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_yellow}"
set -ogq "@catppuccin_${MODULE_NAME}_text" " #($HOME/bin/tmux-agent-count)"

source "$HOME/.tmux/plugins/tmux/utils/status_module.conf"
