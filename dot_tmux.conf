# Clone TPM automatically if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Set the prefix to ^A.
unbind C-b
set -g prefix ^A
bind a send-prefix

# Bind appropriate commands similar to screen.
# lockscreen ^X x 
unbind ^X
bind ^X lock-server
unbind x
bind x lock-server

# screen ^C c 
unbind ^C
bind ^C new-window
bind c new-window

# detach ^D d
unbind ^D
bind ^D detach

# displays * 
unbind *
bind * list-clients

# next ^L ^N sp n 
unbind ^L
bind ^L next-window
unbind ^N
bind ^N next-window
unbind " "
bind " " next-window
unbind n
bind n next-window

# title A
unbind A
bind A command-prompt "rename-window %%"

# other ^A
unbind ^A
bind ^A last-window

# prev ^H ^P p ^? 
unbind ^H
bind ^H previous-window
unbind ^P
bind ^P previous-window
unbind p
bind p previous-window
unbind BSpace
bind BSpace previous-window

# windows ^W w 
unbind ^W
bind ^W list-windows
unbind w
bind w list-windows

# quit \ 
#unbind \
#bind \ confirm-before "kill-server"

# kill K k 
unbind K
bind K confirm-before "kill-window"
unbind k
bind k confirm-before "kill-window"

# redisplay ^L l 
#unbind ^L
#bind ^L refresh-client
#unbind l
#bind l refresh-client

# split -v |
unbind |
bind | split-window

# :kB: focus up
unbind Tab
bind Tab select-pane -t:.+
unbind BTab
bind BTab select-pane -t:.-

# " windowlist -b
unbind '"'
bind '"' choose-window

# Start window numbering from 1 instead of 0
set -g base-index 1

# Automatically re-number windows after one of them is closed
set -g renumber-windows on

# Increase the scrollback history limit
set -g history-limit 10000

bind C-l send-keys 'C-l'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# workmux (https://workmux.raine.dev): agents and worktrees
# g   dashboard: every agent across sessions, live preview, 1-9 to jump
# l   jump to the most recently done/waiting agent (repeat to cycle)
# Tab toggle between current and previous agent
# o   open a worktree window (fzf over the current repo's worktrees)
# t   switch project (fzf over ~/src, zoxide order; builds the first window)
# s   switch session (fzf, most recently used first, pane preview)
# w   worktree menu (add / open / remove / close / dashboard / sidebar)
bind g   display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "workmux dashboard"
bind l   run-shell "workmux last-done"
bind Tab run-shell "workmux last-agent"
bind o   display-popup -E -w 80% -h 60% -d "#{pane_current_path}" "$HOME/bin/workmux-popup open"
bind t   display-popup -E -w 80% -h 60% "$HOME/bin/tmux-sessionizer"
bind s   display-popup -E -w 80% -h 60% "$HOME/bin/tmux-session-switcher"
bind w   display-menu -x C -y C -T "workmux" \
  "add"          a "display-popup -E -w 80% -h 20% -d '#{pane_current_path}' '$HOME/bin/workmux-popup add'" \
  "add w/prompt" p "display-popup -E -w 80% -h 30% -d '#{pane_current_path}' '$HOME/bin/workmux-popup add-prompt'" \
  "open"         o "display-popup -E -w 80% -h 60% -d '#{pane_current_path}' '$HOME/bin/workmux-popup open'" \
  "remove"       r "display-popup -E -w 80% -h 60% -d '#{pane_current_path}' '$HOME/bin/workmux-popup remove'" \
  "close"        c "display-popup -E -w 80% -h 60% -d '#{pane_current_path}' '$HOME/bin/workmux-popup close'" \
  "dashboard"    d "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'workmux dashboard'" \
  "sidebar"      s "run-shell 'workmux sidebar'"

# set -g default-terminal "alacritty"
# set -ga terminal-overrides ",xterm-256color:Tc"
set-option -sa terminal-overrides ",xterm*:Tc"

# Mouse support
set -g mouse on

# Automatic Window Renaming
set-window-option -g automatic-rename on

# Configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_current_text " #W "

# Overrides matching file paths with :[line]:[col] at the end
set -g @fingers-pattern-0 "(([.\\w\\-~\\$@]+)(\\/?[\\w\\-@]+)+\\/?)\\.([\\w]+)(:\\d*:\\d*)?"
# Launches helper script on Ctrl+[key] in fingers mode
set -g @fingers-ctrl-action "xargs -I {} tmux run-shell 'cd #{pane_current_path}; ~/.tmux/plugins/tmux-open-nvim/scripts/ton {} > ~/.tmux/plugins/tmux-open-nvim/ton.log'"s

set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'trevarj/tmux-open-nvim'
run '~/.tmux/plugins/tpm/tpm'
# Load catppuccin
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
# Coding agent inventory (●waiting ▶working ✓done), across every session, from
# workmux. Styled as a catppuccin module so it carries the same icon and
# separators as the others, and appended conditionally so a server with no
# agents shows no pill.
source "$HOME/.tmux/status/agents.conf"
set -g status-interval 5
set -ag status-right "#{?#($HOME/bin/tmux-agent-count),#{E:@catppuccin_status_agents},}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -agF status-right "#{E:@catppuccin_status_battery}"
